name: Build Release Packages

on:
  # 不再随 push 到 main 自动构建发布；仅在打 v*.*.* tag 或手动触发时发布。
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish. Use latest for the rolling website download."
        required: true
        default: "latest"

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"
      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/profilepilot-release.jks"
          chmod 600 "$RUNNER_TEMP/profilepilot-release.jks"
      - name: Build signed APK and run Android checks
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ runner.temp }}/profilepilot-release.jks
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: node scripts/build-phone.mjs --release
      - name: Prepare Android download
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/android/profilepilot-phone.apk
          mkdir -p release
          cp dist/android/profilepilot-phone.apk release/ProfilePilot-android.apk
          cd release
          sha256sum ProfilePilot-android.apk > ProfilePilot-android.apk.sha256
      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: profilepilot-android
          path: release/*
          if-no-files-found: error

  build:
    name: Build ${{ matrix.name }}
    needs: android
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            npm_script: dist:mac:arm64
            artifact: profilepilot-macos-arm64
          - name: macOS x64
            os: macos-15-intel
            npm_script: dist:mac:x64
            artifact: profilepilot-macos-x64
          - name: Windows x64
            os: windows-latest
            npm_script: dist:win
            artifact: profilepilot-windows-x64
    env:
      BUILD_RETRIES: "5"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Electron runtime installation
        run: node node_modules/electron/install.js

      - name: Download companion APK
        uses: actions/download-artifact@v4
        with:
          name: profilepilot-android
          path: android-artifact

      - name: Include companion APK in desktop packages
        run: |
          node -e "const fs = require('node:fs'); fs.mkdirSync('dist/android', { recursive: true }); fs.copyFileSync('android-artifact/ProfilePilot-android.apk', 'dist/android/profilepilot-phone.apk');"

      - name: Type check
        run: npm run check

      - name: Build packages
        run: node scripts/retry-command.mjs npm run ${{ matrix.npm_script }}

      - name: Run test suite
        run: node scripts/run-tests.mjs --test-concurrency=4

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [android, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="latest"
          fi

          if [[ "$tag" == "latest" ]]; then
            name="ProfilePilot latest"
          else
            name="ProfilePilot $tag"
          fi

          {
            echo "tag=$tag"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare release notes from changelog
        run: node scripts/extract-release-notes.mjs "${{ steps.release_meta.outputs.tag }}" release-notes.md

      - name: Move rolling latest tag
        if: steps.release_meta.outputs.tag == 'latest'
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin latest

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          generate_release_notes: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release-assets/*
