name: Build Release Packages

on:
  # Android changes publish automatically; desktop packages still require a tag or manual run.
  push:
    branches: [main]
    tags:
      - "v*.*.*"
    paths:
      - "android-phone/**"
      - "android-camera/**"
      - "scripts/build-phone.mjs"
      - "scripts/phone-build-metadata.mjs"
      - "scripts/build-screen-camera.mjs"
      - "scripts/android-release-version.mjs"
      - "scripts/prepare-android-update.mjs"
      - "scripts/publish-android-update.mjs"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      android_only:
        description: "Build a signed Android APK artifact without publishing a release."
        type: boolean
        required: false
        default: false
      tag:
        description: "Release tag to publish. Use latest for the rolling website download."
        required: true
        default: "latest"

permissions:
  contents: write

concurrency:
  # Serialize all publishers, including manual/tag releases, around the Android feed.
  group: profilepilot-release-packages
  cancel-in-progress: false

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test Android release automation
        run: node --test tests/android-update.test.js tests/android-release.test.js
      - name: Resolve increasing Android version
        id: android_version
        run: node scripts/android-release-version.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/profilepilot-release.jks"
          chmod 600 "$RUNNER_TEMP/profilepilot-release.jks"
      - name: Build signed APK and run Android checks
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ runner.temp }}/profilepilot-release.jks
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: node scripts/build-phone.mjs --release
      - name: Prepare Android download
        env:
          ANDROID_RELEASE_TAG: ${{ steps.android_version.outputs.tag }}
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/android/profilepilot-phone.apk
          node scripts/prepare-android-update.mjs "$ANDROID_RELEASE_TAG"
      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: profilepilot-android
          path: release/*
          if-no-files-found: error

      - name: Upload desktop companion bundle
        uses: actions/upload-artifact@v4
        with:
          name: profilepilot-desktop-companion
          path: |
            dist/android/profilepilot-phone.apk
            dist/android/profilepilot-phone.apk.json
            dist/android/profilepilot-screen-camera.dex
          if-no-files-found: error

  publish_android:
    name: Publish Android app update
    needs: android
    if: ${{ !inputs.android_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: profilepilot-android
          path: release
      - name: Publish verified APK and update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-android-update.mjs

  build:
    name: Build ${{ matrix.name }}
    needs: android
    if: ${{ !inputs.android_only && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            npm_script: dist:mac:arm64
            artifact: profilepilot-macos-arm64
          - name: macOS x64
            os: macos-15-intel
            npm_script: dist:mac:x64
            artifact: profilepilot-macos-x64
          - name: Windows x64
            os: windows-latest
            npm_script: dist:win
            artifact: profilepilot-windows-x64
    env:
      BUILD_RETRIES: "5"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Electron runtime installation
        run: node node_modules/electron/install.js

      - name: Download desktop companion bundle
        uses: actions/download-artifact@v4
        with:
          name: profilepilot-desktop-companion
          path: dist/android

      - name: Type check
        run: npm run check

      - name: Build packages
        run: node scripts/retry-command.mjs npm run ${{ matrix.npm_script }}

      - name: Verify Windows shell startup
        if: runner.os == 'Windows'
        run: node scripts/diagnose-windows-terminal.cjs

      - name: Run test suite
        run: node scripts/run-tests.mjs --test-concurrency=4

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [android, build, publish_android]
    if: ${{ !inputs.android_only && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="latest"
          fi

          if [[ "$tag" == "latest" ]]; then
            name="ProfilePilot latest"
          else
            name="ProfilePilot $tag"
          fi

          {
            echo "tag=$tag"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare release notes from changelog
        run: node scripts/extract-release-notes.mjs "${{ steps.release_meta.outputs.tag }}" release-notes.md

      - name: Move rolling latest tag
        if: steps.release_meta.outputs.tag == 'latest'
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin latest

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          generate_release_notes: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release-assets/*
