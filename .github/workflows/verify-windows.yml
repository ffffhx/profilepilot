name: Verify Windows Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Diagnose shell startup
        run: node scripts/diagnose-windows-terminal.cjs
      - name: Verify Windows integration
        run: node --test tests/browser-preferences.test.js tests/profilepilot-powershell-launcher.test.js tests/task-terminal.test.js
