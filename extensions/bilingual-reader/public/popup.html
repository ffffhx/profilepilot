<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>双语伴读</title><link rel="stylesheet" href="app.css"></head>
<body class="popup">
  <header class="popup-header"><a class="brand" href="options.html" target="_blank"><span class="brand-mark">伴</span><span>双语伴读<small>BILINGUAL READER</small></span></a><button id="open-options" class="icon-button" aria-label="打开设置">⚙</button></header>
