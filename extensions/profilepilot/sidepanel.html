<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProfilePilot</title><link rel="stylesheet" href="popup.css"></head>
<body class="side-panel">
  <header class="app-header">
    <div class="brand"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 2 29 16 16 18 3 30 9 11Z" fill="currentColor"/></svg><h1>ProfilePilot</h1></div>
    <button id="close-panel" class="icon-button" type="button" aria-label="关闭侧边栏"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
  </header>
  <section class="identity-strip" aria-label="连接状态">
    <span class="profile-avatar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4.5 21v-2a7.5 7.5 0 0 1 15 0v2Z" fill="currentColor"/></svg></span>
    <strong id="profile-name">当前 Profile</strong>
    <div id="connection-state" hidden><span id="connection-label" class="connection-label"></span></div>
    <p id="connection-note"></p>
    <div id="status" class="sr-only" role="status">正在读取连接状态…</div>
  </section>
  <p id="error" role="alert" hidden></p>
  <main id="controlled-tab" hidden>
    <div class="section-heading"><h2>当前控制的标签页</h2><span id="control-state" class="control-state"></span></div>
    <div class="page-card">
      <span class="page-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 6.5h1m3 0h1"/></svg></span>
      <div class="page-copy"><p id="page-title"></p><p id="page-domain" hidden></p><p id="page-note" hidden></p></div>
    </div>
  </main>
  <button id="reconnect" type="button" hidden>重新连接</button>
  <form id="connect" class="connect-form" hidden>
    <h2>连接当前浏览器</h2>
    <label for="code">从 ProfilePilot App 或 CLI 获取的配对码</label>
    <textarea id="code" required autocomplete="off" placeholder="PP1.…" spellcheck="false"></textarea>
    <small>请确认当前 Chrome Profile 与生成配对码时选择的 Profile 一致。</small>
    <button id="connect-submit" type="submit" class="primary">连接浏览器服务</button>
  </form>
  <script type="module" src="popup.js"></script>
</body>
</html>
